---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

version: 1
name: silverblue
description: Custom Fedora Silverblue image.
base-image: quay.io/fedora-ostree-desktops/silverblue
image-version: "44"

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: signing

  - type: dnf
    repos:
      nonfree: rpmfusion
    install:
      packages:
        - fedora-repos-ostree
        - ffmpegthumbnailer
        - libheif-freeworld
        - libheif-tools
    remove:
      packages:
        - firefox

  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - org.gnome.Calculator
          - org.gnome.Characters
          - org.gnome.Connections
          - org.gnome.Decibels
          - org.gnome.Epiphany
          - org.gnome.Extensions
          - org.gnome.Firmware
          - org.gnome.Logs
          - org.gnome.Loupe
          - org.gnome.Maps
          - org.gnome.Papers
          - org.gnome.Showtime
          - org.gnome.SimpleScan
          - org.gnome.Snapshot
          - org.gnome.TextEditor
          - org.gnome.Weather
          - org.gnome.World.PikaBackup
          - org.gnome.clocks
          - org.gnome.font-viewer
          - org.mozilla.firefox

  - type: github-binary
    source: local
    repo: FrameworkComputer/framework-system
    asset: framework_tool
