---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

version: 1
name: silverblue
description: Custom Fedora Silverblue image.
base-image: quay.io/fedora-ostree-desktops/silverblue
# renovate: datasource=docker depName=quay.io/fedora-ostree-desktops/silverblue
image-version: "44"

modules:
  - type: signing

  - type: files
    files:
      - source: system
        destination: /

  - type: systemd
    system:
      masked:
        - rpm-ostreed-automatic.timer
      enabled:
        - bootc-fetch-apply-updates.timer
        - flatpak-system-updates.timer
    user:
      enabled:
        - flatpak-user-updates.timer

  - type: dnf
    repos:
      nonfree: rpmfusion
    install:
      packages:
        - fedora-repos-ostree
        - ffmpegthumbnailer
        - libheif-freeworld
        - libheif-tools
        - solaar-udev
    remove:
      packages:
        - fedora-flathub-remote
        - fedora-third-party
        - fedora-workstation-repositories
        - firefox
        - gnome-software
        - totem-video-thumbnailer

  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - org.gnome.Calculator
          - org.gnome.Characters
          - org.gnome.Connections
          - org.gnome.Decibels
          - org.gnome.Epiphany
          - org.gnome.Extensions
          - org.gnome.Firmware
          - org.gnome.Logs
          - org.gnome.Loupe
          - org.gnome.Maps
          - org.gnome.Papers
          - org.gnome.Showtime
          - org.gnome.SimpleScan
          - org.gnome.Snapshot
          - org.gnome.TextEditor
          - org.gnome.Weather
          - org.gnome.World.PikaBackup
          - org.gnome.clocks
          - org.gnome.font-viewer
          - org.mozilla.firefox

  - type: github-binary
    source: local
    repo: FrameworkComputer/framework-system
    asset: framework_tool
