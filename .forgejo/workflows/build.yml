name: Build and push image

on:
  push:
    branches: [main]
    paths:
      - .forgejo/workflows/build.yml
      - 'images/**'

concurrency:
  group: ${{ forgejo.workflow }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.REGISTRY }}/${{ forgejo.repository_owner }}/silverblue
    steps:
      - name: Log in to registry
        uses: https://data.forgejo.org/docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ forgejo.repository_owner }}
          password: ${{ secrets.PACKAGE_TOKEN }}

      - name: Build and push
        id: build
        uses: https://data.forgejo.org/docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: "{{defaultContext}}:images/silverblue"
          file: Containerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            IMAGE_REF=${{ env.IMAGE }}
          tags: ${{ env.IMAGE }}:latest

      # The cosign installer needs envsubst
      - name: Install envsubst
        run: apt-get update -qq && apt-get install -y -qq gettext-base

      - name: Install cosign
        uses: https://data.forgejo.org/sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Bumped by hand, like Bazzite. The sign flags below work around rpm-ostree#5509, container-libs#388
          cosign-release: v3.1.3

      - name: Sign image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          # Cosign prompts when this is unset
          COSIGN_PASSWORD: ""
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"
