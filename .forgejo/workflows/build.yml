name: Build and push images

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.event_name == 'pull_request' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.REGISTRY }}/${{ forgejo.repository_owner }}/silverblue
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install BlueBuild
        run: |
          docker create --name blue-build-installer ghcr.io/blue-build/cli:v0.9-installer
          sudo docker cp blue-build-installer:/out/bluebuild /usr/bin/bluebuild
          docker rm blue-build-installer
          bluebuild --version

      - name: Generate Containerfile from recipe
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            unset GITHUB_ACTIONS
          fi
          bluebuild generate ./recipes/recipe.yml -o Containerfile

      - name: Log in to registry
        if: forgejo.event_name != 'pull_request'
        uses: https://data.forgejo.org/docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ forgejo.server_url }}
          username: ${{ forgejo.repository_owner }}
          password: ${{ secrets.PACKAGE_TOKEN }}

      - name: Build and push
        id: build
        uses: https://data.forgejo.org/docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: ${{ forgejo.event_name != 'pull_request' }}
          provenance: false
          sbom: false
          build-args: |
            IMAGE_REGISTRY=${{ vars.REGISTRY }}/${{ forgejo.repository_owner }}
          tags: ${{ env.IMAGE }}:latest

      # The cosign installer needs envsubst
      - name: Install envsubst
        if: forgejo.event_name != 'pull_request'
        run: apt-get update -qq && apt-get install -y -qq gettext-base

      - name: Install cosign
        if: forgejo.event_name != 'pull_request'
        uses: https://data.forgejo.org/sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign image
        if: forgejo.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          # Cosign prompts when this is unset
          COSIGN_PASSWORD: ""
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"
