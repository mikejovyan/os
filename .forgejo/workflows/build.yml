name: Build and push images

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.event_name == 'pull_request' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.REGISTRY }}/${{ forgejo.repository_owner }}/silverblue
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bluebuild CLI
        run: docker run --pull always --rm ghcr.io/blue-build/cli:latest-installer | bash

      - name: Generate Containerfile from recipe
        run: bluebuild generate ./recipes/recipe.yml -o Containerfile

      - name: Log in to registry
        if: forgejo.event_name == 'push'
        uses: https://data.forgejo.org/docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ forgejo.server_url }}
          username: ${{ forgejo.repository_owner }}
          password: ${{ secrets.PACKAGE_TOKEN }}

      - name: Build and push
        id: build
        uses: https://data.forgejo.org/docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: ${{ forgejo.event_name == 'push' }}
          provenance: false
          sbom: false
          build-args: |
            IMAGE_REGISTRY=${{ vars.REGISTRY }}/${{ forgejo.repository_owner }}
          tags: ${{ env.IMAGE }}:latest

      # The cosign installer needs envsubst
      - name: Install envsubst
        if: forgejo.event_name == 'push'
        run: apt-get update -qq && apt-get install -y -qq gettext-base

      - name: Install cosign
        if: forgejo.event_name == 'push'
        uses: https://data.forgejo.org/sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign image
        if: forgejo.event_name == 'push'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          # Cosign prompts when this is unset
          COSIGN_PASSWORD: ""
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"
