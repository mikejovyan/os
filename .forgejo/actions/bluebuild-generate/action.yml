name: Generate Containerfile with BlueBuild
description: Installs the BlueBuild CLI and generates a Containerfile from a recipe.
inputs:
  recipe:
    description: Path to the recipe file.
    required: false
    default: ./recipes/recipe.yml
  output:
    description: Path to write the generated Containerfile to.
    required: false
    default: Containerfile
runs:
  using: composite
  steps:
    - name: Install BlueBuild
      shell: bash
      run: |
        set -euo pipefail
        docker create --name blue-build-installer ghcr.io/blue-build/cli:v0.9-installer
        sudo docker cp blue-build-installer:/out/bluebuild /usr/bin/bluebuild
        docker rm blue-build-installer
        bluebuild --version

    - name: Generate Containerfile from recipe
      shell: bash
      run: |
        if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
          unset GITHUB_ACTIONS
        fi
        bluebuild generate "${{ inputs.recipe }}" -o "${{ inputs.output }}"
